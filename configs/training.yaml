training:
  learning_rate: 1.0e-5
  batch_size: 16
  epochs: 8
  weight_decay: 0.01
  warmup_steps: 500
  seed: 42
  metric_for_best_model: "f1_macro"
  greater_is_better: True
  load_best_model_at_end: True
  deteminism: false
  early_stopping:
    enabled: true
    patience: 2
    threshold: 0.0


  # Explicit runtime defaults; enable fp16/bf16 only on suitable hardware.
  fp16: false
  bf16: false
  gradient_accumulation_steps: 1
  save_total_limit: 2

# Use the same tokenization for all compared experiments, including CLP.
tokenization:
  max_length: 512
  overlength_policy: filter_pairs
