dataset:
  name: 3D_combined
  config_name: null
  text_column: text
  label_column: label
  gender_column: gender_label
  source: local

  local:
    path: data/raw/3DatasetsCombined.csv

  columns:
    text: text
    label: class


  label_mapping:
    mode: binary
    num_labels: 2
    mapping:
      neither: 0
      hateful: 1
    names:
      0: neither
      1: hateful

  split:
    directory: data/processed/splits/3D_combined
    seed: 42
    train_split_size: 0.6
    validation_split_size: 0.1
    test_split_size: 0.3
