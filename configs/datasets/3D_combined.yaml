dataset:
  name: 3D_combined
  config_name: null
  text_column: text
  label_column: label
  gender_column: gender_label
  source: local

  local:
    path: data/raw/3DatasetsCombined.csv

  columns:
    text: text
    label: majority_label
  preserve_columns: [majority_label, majority_votes, source_row]

  label_mapping:
    mode: binary
    num_labels: 2
    mapping:
      normal: 0
      spam: 0
      abusive: 1
      hateful: 1
    names:
      0: neither
      1: harmful

  split:
    directory: data/processed/splits/3D_combined
    seed: 42
    preprocessing_version: -
    train_split_size: 0.6
    validation_split_size: 0.1
    test_split_size: 0.3
